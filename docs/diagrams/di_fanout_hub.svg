<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Helvetica, Arial, sans-serif">
  <title>FastAPI DI fan-out hub (schematic)</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>
  <!-- Background -->
  <rect x="0" y="0" width="900" height="560" rx="8" fill="#fafbfc"/>
  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#24292f">FastAPI Dependency Injection — the "fan-out hub" pattern (schematic)</text>
  <text x="450" y="60" text-anchor="middle" font-size="12" fill="#57606a">One shared dependency reused by many route handlers · found in 91.3% of clean graph-bearing repos</text>

  <!-- Central dependency hub -->
  <ellipse cx="450" cy="300" rx="120" ry="46" fill="#ddf4ff" stroke="#0969da" stroke-width="2.5"/>
  <text x="450" y="298" text-anchor="middle" font-size="13" font-weight="bold" fill="#0969da">get_db</text>
  <text x="450" y="315" text-anchor="middle" font-size="11" fill="#0969da">(shared dependency)</text>
  <text x="450" y="268" text-anchor="middle" font-size="10" fill="#57606a">Depends(get_db)</text>

  <!-- Route handler nodes (spokes) -->
  <!-- top-left -->
  <rect x="70" y="70" width="180" height="40" rx="8" fill="#fff" stroke="#57606a" stroke-width="1.5"/>
  <text x="160" y="90" text-anchor="middle" font-size="12" fill="#24292f">GET /users</text>
  <text x="160" y="103" text-anchor="middle" font-size="9" fill="#57606a">list_users(db)</text>
  <!-- top -->
  <rect x="360" y="40" width="200" height="40" rx="8" fill="#fff" stroke="#57606a" stroke-width="1.5"/>
  <text x="460" y="60" text-anchor="middle" font-size="12" fill="#24292f">POST /users</text>
  <text x="460" y="73" text-anchor="middle" font-size="9" fill="#57606a">create_user(db)</text>
  <!-- top-right -->
  <rect x="660" y="70" width="180" height="40" rx="8" fill="#fff" stroke="#57606a" stroke-width="1.5"/>
  <text x="750" y="90" text-anchor="middle" font-size="12" fill="#24292f">GET /items</text>
  <text x="750" y="103" text-anchor="middle" font-size="9" fill="#57606a">list_items(db)</text>
  <!-- bottom-left -->
  <rect x="110" y="430" width="180" height="40" rx="8" fill="#fff" stroke="#57606a" stroke-width="1.5"/>
  <text x="200" y="450" text-anchor="middle" font-size="12" fill="#24292f">GET /orders</text>
  <text x="200" y="463" text-anchor="middle" font-size="9" fill="#57606a">list_orders(db)</text>
  <!-- bottom -->
  <rect x="360" y="460" width="200" height="40" rx="8" fill="#fff" stroke="#57606a" stroke-width="1.5"/>
  <text x="460" y="480" text-anchor="middle" font-size="12" fill="#24292f">PUT /users</text>
  <text x="460" y="493" text-anchor="middle" font-size="9" fill="#57606a">update_user(db)</text>
  <!-- bottom-right -->
  <rect x="660" y="430" width="180" height="40" rx="8" fill="#fff" stroke="#57606a" stroke-width="1.5"/>
  <text x="750" y="450" text-anchor="middle" font-size="12" fill="#24292f">DELETE /items</text>
  <text x="750" y="463" text-anchor="middle" font-size="9" fill="#57606a">delete_item(db)</text>

  <!-- Edges from hub to handlers (dependency flows outward) -->
  <!-- list_users -->
  <path d="M 200 110 C 300 170 350 220 395 275" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- create_user -->
  <path d="M 460 82 C 460 150 458 210 456 252" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- list_items -->
  <path d="M 700 110 C 600 170 550 220 505 275" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- list_orders -->
  <path d="M 240 470 C 320 390 370 340 415 320" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- update_user -->
  <path d="M 460 500 C 460 440 458 380 456 348" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- delete_item -->
  <path d="M 660 470 C 580 390 530 340 485 320" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Bottom annotation -->
  <text x="450" y="548" text-anchor="middle" font-size="11" fill="#57606a">
    Each handler declares Depends(get_db); the DB connection is resolved and injected once per request by FastAPI.
  </text>
</svg>
