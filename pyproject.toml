[project]
name = "fastapi-di-corpus"
version = "0.1.0"
description = "Corpus construction and extraction pipeline for the FastAPI dependency-injection MSR study"
requires-python = ">=3.12,<3.15"
dependencies = [
    "pydantic>=2.13,<3",
    "python-dotenv>=1.2,<2",
    "requests>=2.33,<3",
]

[tool.uv]
package = false
constraint-dependencies = [
    "pydantic==2.13.2",
    "python-dotenv==1.2.1",
    "requests==2.33.1",
]
